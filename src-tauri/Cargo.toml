[package]
name = "kawagiif"
version = "0.1.0"
description = "Animaciones, GIFs y vídeos siempre visibles sobre el escritorio"
authors = ["Alberto"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "kawagiif_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `protocol-asset` es obligatoria porque tauri.conf.json activa
# `assetProtocol`: es la que permite servir los archivos de la biblioteca en
# streaming en vez de codificarlos en base64 en memoria.
tauri = { version = "2", features = ["tray-icon", "protocol-asset"] }
tauri-plugin-global-shortcut = "2"
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Dwm",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
dirs = "6"
uuid = { version = "1", features = ["v4", "serde"] }
tauri-plugin-dialog = "2"
tauri-plugin-autostart = "2"
# Memoria del sistema y de los procesos, para el medidor de RAM de Ajustes.
sysinfo = "0.33"


# Compilación incremental para que los cambios en Rust durante el desarrollo
# recompilen solo lo que ha cambiado en vez del crate entero.
[profile.dev]
incremental = true

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm-minor-patch:
        update-types:
          - 'minor'
          - 'patch'
    ignore:
      # The Tauri CLI requires @tauri-apps/* to match the Rust tauri crate: upgrade both together by hand.
      - dependency-name: '@tauri-apps/*'
        update-types: ['version-update:semver-minor', 'version-update:semver-major']
      # TypeScript majors change the compiler; adopt them on purpose, not from a weekly PR.
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']

  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
    groups:
      cargo-minor-patch:
        update-types:
          - 'minor'
          - 'patch'
    # These must be upgraded together by hand: our `windows` crate must equal
    # the version tao uses (check `cargo tree -i windows`). Security updates
    # still arrive.
    ignore:
      - dependency-name: 'tauri*'
        update-types: ['version-update:semver-minor', 'version-update:semver-major']
      - dependency-name: 'tao'
        update-types: ['version-update:semver-minor', 'version-update:semver-major']
      - dependency-name: 'windows'
        update-types: ['version-update:semver-minor', 'version-update:semver-major']
      - dependency-name: 'webview2-com*'
        update-types: ['version-update:semver-minor', 'version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions-minor-patch:
        update-types:
          - 'minor'
          - 'patch'